# dank-ws: make sure a model exists before the daemon starts (first login downloads base.en).
# The upstream unit's Wants=ydotool.service is harmless: ydotool is not packaged for EL10 and
# voxtype types with wtype instead.
[Unit]
Wants=dank-ws-voxtype-model.service
After=dank-ws-voxtype-model.service
