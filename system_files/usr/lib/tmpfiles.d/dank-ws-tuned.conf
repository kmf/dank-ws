# /var/log/tuned is created with var_log_t on first boot of a bootc deployment,
# so tuned_ppd_t (SELinux) cannot write its log and tuned-ppd.service fails with
# "Permission denied: /var/log/tuned/tuned-ppd.log". Create it and relabel it to
# its policy default (tuned_log_t) before tuned-ppd starts.
d /var/log/tuned 0755 root root -
Z /var/log/tuned - - -
